<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-version" content="dev">
<meta name="app-built" content="">
<meta name="theme-color" content="#1f3a5f">
<meta name="description" content="記帳、股票交易、萬用清單、資料分析：四種試算表一個網站，資料存在自己的裝置。">
<title>taco 試算表</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="taco試算表">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--sub:#5b6577;--muted:#8a93a3;--line:#e2e6ee;--soft:#f0f3f8;
  --accent:#2a78d6;--accent-ink:#fff;--s1:#2a78d6;--s2:#eb6834;--good:#1a8f5a;--bad:#c4392b;--warn-bg:#fdecd6;--bad-bg:#fbe1dd;--now:#e8f1fc;--nav:#1f3a5f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151c;--card:#1a2029;--ink:#eef1f6;--sub:#b4bccb;--muted:#8791a3;--line:#2b3340;--soft:#222a35;
  --accent:#3987e5;--accent-ink:#0d1420;--s1:#3987e5;--s2:#d95926;--good:#4cc38a;--bad:#ff7b6b;--warn-bg:#3a2a14;--bad-bg:#3d1d1a;--now:#1d2b40;--nav:#0d1420}}
:root[data-theme="dark"]{--bg:#11151c;--card:#1a2029;--ink:#eef1f6;--sub:#b4bccb;--muted:#8791a3;--line:#2b3340;--soft:#222a35;
  --accent:#3987e5;--accent-ink:#0d1420;--s1:#3987e5;--s2:#d95926;--good:#4cc38a;--bad:#ff7b6b;--warn-bg:#3a2a14;--bad-bg:#3d1d1a;--now:#1d2b40;--nav:#0d1420}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
header.top{background:var(--nav);color:#fff;padding:max(10px,env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;flex:1;letter-spacing:.5px}
header.top button{background:rgba(255,255,255,.14);color:#fff;border:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:8px 2px 7px;font-size:11.5px;color:var(--sub);text-decoration:none}
nav.tabs a span{display:block;font-size:19px;line-height:1.3}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
@media (min-width:760px){body{padding-bottom:24px}nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center}
  nav.tabs a{flex:0 0 auto;padding:10px 18px;font-size:14px}nav.tabs a span{display:inline;font-size:15px;margin-right:4px}}
main{max-width:980px;margin:0 auto;padding:14px 16px}
h2{font-size:17px;margin:2px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--sub);min-width:0}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0;color:var(--ink)}
input[type=checkbox]{width:auto}
textarea{resize:vertical}
button{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
button:active{transform:scale(.97)}
button.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.sm{padding:4px 9px;font-size:13px}
button.danger{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.msg{font-size:13px;color:var(--good);min-height:1.2em;margin:6px 0 0}
.msg.err{color:var(--bad)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--soft);color:var(--sub);font-weight:600;font-size:12.5px;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;background:var(--soft)}
td.l,th.l{text-align:left}
td.code{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);text-align:left}
.neg{color:var(--bad)}
.pos{color:var(--good)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
a.tile{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;overflow:hidden}
a.tile:active{transform:scale(.99)}
a.tile .ic{font-size:26px}
a.tile b{display:block;font-size:16px;margin:2px 0}
a.tile p{margin:0 0 10px;font-size:12.5px;color:var(--sub)}
a.tile .kpi{display:flex;gap:18px}
a.tile .kpi small{display:block;font-size:11.5px;color:var(--muted)}
a.tile .kpi strong{font-size:20px;font-variant-numeric:tabular-nums}
a.tile::after{content:"開啟 ›";position:absolute;right:14px;top:14px;font-size:12px;color:var(--accent);font-weight:700}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stats div small{display:block;font-size:12px;color:var(--muted)}
.stats div strong{font-size:22px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;background:var(--card)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;word-break:break-word}
.item .meta{font-size:12.5px;color:var(--sub);margin-top:2px;word-break:break-word}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item.overdue{background:var(--bad-bg)}
.item.soon{background:var(--warn-bg)}
.badge{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--sub);background:var(--bg);margin-right:4px}
.badge.hi{color:var(--bad);border-color:var(--bad);font-weight:700}
.badge.due-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.badge.due-soon{background:#d98a00;border-color:#d98a00;color:#fff}
.ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:96px 1fr 92px;gap:8px;align-items:center;font-size:13px}
.bar .track{background:var(--soft);border-radius:4px;height:14px;overflow:hidden}
.bar .fill{background:var(--s1);height:100%;border-radius:0 4px 4px 0}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.bar.other .fill{background:var(--muted)}
svg.chart{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
svg.chart text{fill:var(--sub);font-size:10.5px}
svg.chart .grid{stroke:var(--line)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--sub);margin:0 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
details summary{cursor:pointer;font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--soft);font-size:12px;color:var(--sub)}
.ver{text-align:center;font-size:12px;color:var(--muted);margin:10px 0 0}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:13.5px}
.corr td{text-align:center;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13.5px;z-index:20;max-width:90vw}
@media (min-width:760px){.toast{bottom:24px}}
</style>
</head>
<body>
<header class="top">
  <h1>📒 taco 試算表</h1>
  <button id="install" class="sm" hidden>安裝到桌面</button>
</header>
<nav class="tabs" aria-label="切換試算表">
  <a href="#home" data-v="home"><span>🏠</span>首頁</a>
  <a href="#budget" data-v="budget"><span>📒</span>記帳</a>
  <a href="#stock" data-v="stock"><span>📈</span>股票</a>
  <a href="#todo" data-v="todo"><span>✅</span>清單</a>
  <a href="#analysis" data-v="analysis"><span>📊</span>分析</a>
  <a href="#settings" data-v="settings"><span>⚙️</span>設定</a>
</nav>
<main id="view" tabindex="-1"></main>
<p class="ver" id="ver"></p>
<div class="toast" id="toast" role="status" hidden></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
